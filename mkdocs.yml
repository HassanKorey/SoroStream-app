site_name: SoroStream Documentation
site_description: Trustless, per-second linear asset streaming and cliff vesting protocol on Stellar (Soroban)
site_author: Hassan Akorede (EDUN)
site_url: https://HassanKorey.github.io/SoroStream-app/
repo_name: HassanKorey/SoroStream-app
repo_url: https://github.com/HassanKorey/SoroStream-app

theme:
  name: material
  palette:
    - scheme: slate
      primary: emerald
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: emerald
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Smart Contracts: contracts/vesting_stream.md
  - TypeScript SDK: sdks/typescript.md
  - API Reference: api-reference.md
