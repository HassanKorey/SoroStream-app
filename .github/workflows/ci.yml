name: SoroStream App CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-quality:
    name: FastAPI Backend & Security Suite (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx

      - name: Run Ruff Linter
        working-directory: backend
        run: ruff check app tests

      - name: Run Pytest (API & Security Attack Vectors)
        working-directory: backend
        run: pytest -v

  sdk-quality:
    name: TypeScript Client SDK (@sorostream/sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm install

      - name: Build TypeScript SDK
        working-directory: sdk
        run: npm run build

      - name: Run SDK Unit Tests
        working-directory: sdk
        run: npm test

  frontend-quality:
    name: Next.js Frontend dApp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build
